<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <!-- सुंदर दिसण्यासाठी Bootstrap CDN जोडले आहे -->
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <h3>Student Registration</h3>
                    </div>
                    <div class="card-body p-4">
                        
                        <!-- फॉर्म सुरू -->
                        <form method="POST">
                            <!-- Django मध्ये सुरक्षेसाठी csrf_token आवश्यक आहे -->
                            {% csrf_token %}
                            
                          
                            <div class="mb-3">
                                <label for="name" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="name" name="name" required placeholder="Enter student name">
                            </div>

                          
                            <div class="mb-3">
                                <label for="email" class="form-label">Email Address</label>
                                <input type="email" class="form-control" id="email" name="email" required placeholder="Enter student email">
                            </div>

                          
                            <button type="submit" class="btn btn-primary w-100">Register</button>
                        </form>
                        

                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
